<footer class="site-footer">
  <div class="shell footer-shell">
    <span>© {{ site.time | date: '%Y' }} Parth Batra</span>
    <span class="footer-links">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      <a href="https://x.com/{{ site.twitter_username }}" target="_blank" rel="noopener">X</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </span>
  </div>
</footer>

<script>
  document.querySelectorAll(".post-content a[href]").forEach(function (link) {
    if (link.getAttribute("href").charAt(0) === "#") return;
    link.setAttribute("target", "_blank");
    link.setAttribute("rel", "noopener");
  });
</script>
