<header class="site-header">
  <div class="shell header-shell">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">Parth Batra</a>

    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation %}
        {% assign is_current = false %}
        {% if page.url contains item.url %}{% assign is_current = true %}{% endif %}
        {% if page.layout == 'post' and item.url == '/blog/' %}{% assign is_current = true %}{% endif %}
        <a class="page-link" href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}

      <button type="button" class="theme-toggle" aria-label="Toggle dark theme" data-theme-toggle>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
