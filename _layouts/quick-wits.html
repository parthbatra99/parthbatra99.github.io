---
layout: default
---

<article class="shell quick-wits-page" data-quick-wits-page>
  <header class="page-head">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="page-dek">{{ page.description }}</p>
    <p class="page-meta">
      <span><span data-qw-stat="tweets">{{ page.content | split: 'class="tweet-entry"' | size | minus: 1 }}</span> takes</span>
      <span aria-hidden="true">·</span>
      <span>updated {{ site.time | date: "%b %d, %Y" }}</span>
      <span aria-hidden="true">·</span>
      <a href="https://x.com/batra99" target="_blank" rel="noopener">@batra99</a>
    </p>
  </header>

  <div class="quick-takes-content">
    <div class="takes-list organized-takes prose" data-qw-feed>
      {{ content }}
    </div>
  </div>

  <footer class="quick-takes-footer">
    <p>Have thoughts? <a href="https://x.com/batra99" target="_blank" rel="noopener">Tweet at me</a>.</p>
  </footer>
</article>

<script src="{{ '/assets/js/quick-wits.js' | relative_url }}" defer></script>
